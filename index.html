    <div id="root"><div class="boot-screen"><span class="boot-mark">forma<span>.</span></span><p>Preparing your considered home…</p></div></div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (root && !root.dataset.appMounted) root.innerHTML = '<div class="boot-screen boot-error"><span class="boot-mark">forma<span>.</span></span><h1>The storefront could not start.</h1><p>' + String(event.message || 'A browser error occurred.').replace(/[<>&]/g, '') + '</p><small>Open DevTools → Console for the full error, then refresh after the fix.</small></div>';
      });
      window.addEventListener('unhandledrejection', function (event) {
        var root = document.getElementById('root');
        var reason = event.reason && (event.reason.message || event.reason);
        if (root && !root.dataset.appMounted) root.innerHTML = '<div class="boot-screen boot-error"><span class="boot-mark">forma<span>.</span></span><h1>The storefront could not start.</h1><p>' + String(reason || 'An asynchronous browser error occurred.').replace(/[<>&]/g, '') + '</p><small>Open DevTools → Console for the full error, then refresh after the fix.</small></div>';
      });
    </script>
